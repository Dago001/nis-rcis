name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nis_rcis
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: nis_rcis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nis_rcis" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pgsql, pdo_pgsql, redis, gd, intl, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && php artisan passport:keys
      - run: vendor/bin/pint --test
      - run: vendor/bin/pest
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: nis_rcis
          DB_PASSWORD: secret

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build
        env:
          APP_URL: http://localhost:3000
          API_URL: http://127.0.0.1:8000
          SESSION_SECRET: build-time-placeholder-secret-not-used-at-runtime

  # End-to-end: the real system in a browser (public site, applicant
  # sign-up and wizard, staff sign-in with the authenticator).
  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nis_rcis
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: nis_rcis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nis_rcis" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pgsql, pdo_pgsql, redis, gd, intl, mbstring
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: scripts/ci/e2e-setup.sh
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/storage/logs
          retention-days: 7
