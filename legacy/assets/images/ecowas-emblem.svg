<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#d4af37" stroke-width="6"/>
  <!-- Inner Green Circle -->
  <circle cx="100" cy="100" r="88" fill="#1a5c2e" stroke="#113f1f" stroke-width="2"/>
  <!-- Innermost Golden Circle -->
  <circle cx="100" cy="100" r="62" fill="#fffdfa" stroke="#d4af37" stroke-width="3"/>
  
  <!-- Curved Text CEDEAO -->
  <path id="curveTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <text fill="#ffffff" font-family="'Arial Black', Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">CEDEAO</textPath>
  </text>
  
  <!-- Curved Text ECOWAS -->
  <path id="curveBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  <text fill="#ffffff" font-family="'Arial Black', Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">ECOWAS</textPath>
  </text>
  
  <!-- West Africa Map Silhouette in Center -->
  <g transform="translate(62, 60) scale(0.75)" fill="#d4af37" stroke="#113f1f" stroke-width="1.5">
    <path d="M 10,25 C 20,15 35,18 50,15 C 65,12 80,18 90,25 C 95,35 88,48 85,55 C 80,68 65,70 55,75 C 45,80 30,85 20,75 C 10,65 5,50 8,38 Z"/>
    <circle cx="50" cy="45" r="5" fill="#1a5c2e"/>
  </g>
</svg>
