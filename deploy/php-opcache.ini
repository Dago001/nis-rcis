; /etc/php/8.5/fpm/conf.d/99-nis-rcis.ini
; Keep compiled PHP in memory. Code only changes on deploy, and deploy.sh
; reloads PHP-FPM (which empties this cache), so files are never re-checked.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Releases are switched with a symlink; cache resolved paths for a while.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
