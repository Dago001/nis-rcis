# Laravel API + OAuth2 authorization server (PHP-FPM).
# Public:   https://api.rcis.example.gov.ng  (behind Cloudflare, Full (strict) TLS)
# Internal: http://127.0.0.1:8080            (used by the Next.js BFF only)

include /etc/nginx/snippets/cloudflare-real-ip.conf;

limit_req_zone $binary_remote_addr zone=nis_api:10m rate=20r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.rcis.example.gov.ng;

    # Cloudflare Origin CA certificate (or any valid certificate)
    ssl_certificate     /etc/ssl/nis-rcis/origin.pem;
    ssl_certificate_key /etc/ssl/nis-rcis/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Optional: only accept connections that come through Cloudflare
    # ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;

    root /var/www/nis-rcis/current/backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        limit_req zone=nis_api burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm-nis-rcis.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Never execute or serve anything else
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}

# Internal listener for the Next.js server (not reachable from outside).
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root /var/www/nis-rcis/current/backend/public;
    index index.php;
    client_max_body_size 12m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm-nis-rcis.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Links in e-mails always use APP_URL (see AppServiceProvider).
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.rcis.example.gov.ng;
    return 301 https://$host$request_uri;
}
