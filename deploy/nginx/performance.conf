# /etc/nginx/conf.d/nis-rcis-performance.conf  (http context, applies to both sites)
# Compression matters most for applicants on slow mobile networks: JSON and
# HTML shrink to a fifth or less. Cloudflare re-compresses with Brotli at the edge.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml
           application/manifest+json application/rss+xml image/svg+xml font/ttf font/otf;

# Reuse connections instead of a new TLS handshake per request.
keepalive_timeout 65s;
keepalive_requests 1000;

# Cache file handles for static files.
open_file_cache max=10000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_errors on;
