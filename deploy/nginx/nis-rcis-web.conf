# Next.js frontend (applicant portal + staff console), reverse proxied.
# Public: https://rcis.example.gov.ng  (behind Cloudflare, Full (strict) TLS)

include /etc/nginx/snippets/cloudflare-real-ip.conf;

upstream nis_rcis_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rcis.example.gov.ng;

    ssl_certificate     /etc/ssl/nis-rcis/origin.pem;
    ssl_certificate_key /etc/ssl/nis-rcis/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;
    server_tokens off;

    # Long-lived caching for hashed build assets
    location /_next/static/ {
        alias /var/www/nis-rcis/current/frontend/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nis_rcis_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append): the real client IP restored from Cloudflare.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rcis.example.gov.ng;
    return 301 https://$host$request_uri;
}
