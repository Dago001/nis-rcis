# Next.js frontend (applicant portal + staff console), reverse proxied.
# Public: https://rcis.example.gov.ng  (behind Cloudflare, Full (strict) TLS)

include /etc/nginx/snippets/cloudflare-real-ip.conf;

# Defines upstream nis_rcis_next: one Next.js process per CPU core, written by install-ubuntu.sh.
include /etc/nginx/snippets/nis-rcis-next-upstream.conf;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rcis.example.gov.ng;

    ssl_certificate     /etc/ssl/nis-rcis/origin.pem;
    ssl_certificate_key /etc/ssl/nis-rcis/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;
    server_tokens off;

    # Proxy settings for every hand-off to Next.js below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append): the real client IP restored from Cloudflare.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    # Another instance answers while one restarts during a deploy (idempotent requests only).
    proxy_next_upstream error timeout http_502 http_503;

    # Long-lived caching for hashed build assets (^~: takes priority over the regex below)
    location ^~ /_next/static/ {
        alias /var/www/nis-rcis/current/frontend/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fonts and images from public/ straight from disk: no Node.js round trip, and
    # browsers keep them for a week (file names are not hashed, so not forever).
    location ~* \.(?:woff2|png|jpe?g|webp|svg|ico)$ {
        root /var/www/nis-rcis/current/frontend/public;
        try_files $uri @next;
        access_log off;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        proxy_pass http://nis_rcis_next;
    }

    # Not a file in public/ (e.g. a generated icon): Next.js answers.
    location @next {
        proxy_pass http://nis_rcis_next;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rcis.example.gov.ng;
    return 301 https://$host$request_uri;
}
