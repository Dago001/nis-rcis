; /etc/php/8.5/fpm/pool.d/nis-rcis.conf
[nis-rcis]
user = nis-rcis
group = nis-rcis
listen = /run/php/php8.5-fpm-nis-rcis.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Workers are always running (no start-up delay under a traffic spike).
; install-ubuntu.sh replaces @CHILDREN@ with a size for this server's
; CPU and memory, capped so PostgreSQL's 100 connections are never exhausted.
pm = static
pm.max_children = @CHILDREN@
pm.max_requests = 1000
listen.backlog = 4096
; Requests stuck longer than this are logged, not left to pile up.
request_slowlog_timeout = 5s
slowlog = /var/log/php8.5-fpm-nis-rcis-slow.log

php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 256M
php_admin_value[expose_php] = Off
php_admin_value[session.cookie_secure] = 1
php_admin_flag[display_errors] = off
