<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Round Official Seal Stamp -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#991b1b" stroke-width="4" stroke-dasharray="1 0"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#991b1b" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="55" fill="none" stroke="#991b1b" stroke-width="2"/>
  
  <!-- Curved Text NIGERIA IMMIGRATION SERVICE -->
  <path id="stampTop" d="M 28,100 A 72,72 0 0,1 172,100" fill="none"/>
  <text fill="#991b1b" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" letter-spacing="1.5">
    <textPath href="#stampTop" startOffset="50%" text-anchor="middle">NIGERIA IMMIGRATION SERVICE</textPath>
  </text>
  
  <!-- Curved Text RESIDENCE CARD DIVISION -->
  <path id="stampBottom" d="M 172,100 A 72,72 0 0,1 28,100" fill="none"/>
  <text fill="#991b1b" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" letter-spacing="1.2">
    <textPath href="#stampBottom" startOffset="50%" text-anchor="middle">RESIDENCE CARD ISSUANCE</textPath>
  </text>
  
  <!-- Center Star & Official Seal Text -->
  <polygon points="100,68 103,77 112,77 105,82 108,91 100,85 92,91 95,82 88,77 97,77" fill="#991b1b"/>
  <text x="100" y="106" fill="#991b1b" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ISSUED &amp; SEALED</text>
  <text x="100" y="122" fill="#991b1b" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">NIS HQ ABUJA</text>
</svg>
